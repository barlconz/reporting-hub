    "PDE-4599": "Non-Integrated Parallel Testing is a payroll assurance phase where payroll is run in a standalone Datapay environment without live upstream or downstream integrations. Its purpose is to prove that core payroll processing works correctly on its own: employee setup, leave setup, pay data processing, pay run execution, and variance checking. In practice, this means loading full employee data (including leave balances and 52-week earnings), running payroll in parallel with the current payroll process, and comparing outcomes to confirm gross-to-net calculations, deductions, statutory obligations, and overall payroll accuracy.\n\nNIP Testing is critical because it isolates payroll behavior from integration noise and exposes calculation, configuration, and data quality issues early. It gives the programme a controlled way to validate compliance and identify defects before integrated testing and production deployment. By documenting and triaging variances in partnership between Datapay and payroll stakeholders, NIP creates confidence that payroll outputs are accurate for all employee groups and that the system is ready to progress into end-to-end integration and go-live stages.\n\nThe programme will encourage SMEs to use the NIP environment once the variations have been resolved - this will give the business an early opportunity to interact with the new system and to execute BAU processes.",
    "PDE-4604": "The E2E Test Phase validates critical business scenarios across the integrated landscape, beginning only after connectivity testing has confirmed secure and reliable data exchange across all in-scope interfaces. Connectivity execution is expected to reuse available lower-tier environments, including downstream TWoA systems that only provide dev or test instances. Following connectivity, a stabilization phase will be run to resolve high-impact defects, harden interface reliability, and improve test-data consistency before scaling SME and Business User execution.\n\nE2E then focuses on end-to-end process assurance with significant SME and Business User participation, validating real business flows, role-based execution, and cross-system outcomes with production-like migrated data. Responsibilities are partitioned by integration path: KPMG and Datacom lead Workday-to-Datapay testing, KPMG leads Workday-to-AIS testing, and TWoA leads AIS downstream testing and downstream business-flow validation. TWoA retains overall governance accountability for E2E, including entry/exit control, defect triage oversight, evidence quality, and go-forward readiness recommendations.\n\nTo align strategy with this approach, downstream E2E validation for TWoA-owned systems should be explicitly moved from exclusions into scope, with named interfaces and clear ownership.\n\nThis phase will require high levels of coordination and cooperation to ensure all tests are covered.",
    "PDE-4606": "",
    "PDE-4607": "",
    "PDE-4608": "User Acceptance Testing (UAT) is the business-led phase where TWoA validates that the delivered solution is fit for operational use, supports intended business outcomes, and is acceptable for go-live. In this phase, business representatives execute formal and informal tests from a user perspective across in-scope processes, roles, and controls, using production-like migrated data in an integrated environment. UAT confirms that configured processes, integrations, and role-based access operate as expected in real-world scenarios, with evidence captured for traceability and decision-making.\n\nUAT is owned by TWoA, with KPMG providing support for planning, execution coordination, defect handling, and issue resolution triage. Execution is governed through defined entry and exit criteria, structured reporting, and phase gate reviews to ensure readiness and risk are transparent. Defects are managed through the programme defect process, with business impact and testing impact used to prioritise remediation, and closure based on retest evidence against agreed design. The outcome of UAT is a clear business acceptance position, including any agreed residual risks and conditions for progression toward production readiness.\n\nCould the programme team please confirm the intended UAT boundary for Phase 1, specifically whether UAT is expected to be limited to Workday and nearest-neighbour validation, or whether it explicitly includes end-to-end validation into TWoA downstream systems? The current strategy appears to position downstream system testing as out of scope at programme level, while also stating that UAT is business-led and may include steps in third-party environments. To avoid ambiguity in planning, resourcing, and entry/exit criteria, we need a clear decision on the target UAT scope, including which downstream interfaces are in scope, which are excluded, and who owns execution and sign-off for each path. Which option:\n\nUAT scope option A: Workday plus nearest-neighbour only, with downstream validation excluded.\n\nUAT scope option B: Workday plus defined TWoA downstream systems, with named ownership and sign-off.\n\nPlease confirm the selected option and the in-scope interface list so we can align the UAT plan, governance gates, and delivery dates.",
    "PDE-4616": "Parallel Run covers the controlled comparison of payroll outcomes between the legacy payroll process and the new Workday-to-Datapay process for the same pay periods, using representative employee data and real pay scenarios. Its purpose is to confirm that the new solution produces accurate and compliant results before go-live by reconciling gross-to-net outcomes, deductions, PAYE/KiwiSaver, leave balances and entitlements, and other statutory calculations. It also covers investigation and triage of variances, confirmation of data quality and mapping assumptions, and evidence-based sign-off that any differences are either resolved or formally accepted.\n\nIn practical terms, the phase includes execution of parallel pay runs, variance reporting and analysis, defect/workaround management, and readiness confirmation for production payroll operation. It does not replace broader business process acceptance; rather, it is the payroll assurance gate focused on payroll accuracy, control, and operational confidence for cutover.",
    "PDE-4677": "This SIT stream covers integration assurance for the Workday <> AIS <> TWoA downstream pathway, validating both the upstream Workday-to-AIS integration boundary and the downstream AIS-to-consumer delivery boundary. The objective is to prove interface reliability, transformation correctness, and delivery integrity across the full integration chain.\n\nExecution starts with mandatory connectivity testing across all relevant boundaries to confirm endpoint availability, secure transport, encryption/decryption handling, and controlled operational message/file flow. This establishes baseline technical readiness before business-shaped scenarios are executed.\n\nScenario execution then validates end-to-end interface processing across the chain: schema compliance, payload conformance, transformation/mapping accuracy in AIS, and successful downstream delivery with data integrity preserved. The stream includes negative-path validation such as exception handling, retries, dead-letter/reprocess controls, and operational monitoring supportability.\n\nResponsibility is intentionally split: KPMG executes Workday-to-AIS testing, while TWoA executes AIS-to-downstream testing. TWoA also retains overall SIT governance and assurance accountability across the stream, including integrated planning, execution control, defect triage governance, traceability, and consolidated quality reporting to support risk-based progression into E2E and UAT.",

    "PDE-4874": "Dress Rehearsal Testing is the final integrated proving cycle before production go-live. It validates that priority business journeys, payroll-parallel-aligned controls, and cross-stream operational dependencies can be executed with predictable outcomes in near-production conditions.\n\nThis cycle provides the final evidence baseline for go/no-go governance by confirming execution stability, defect containment, data reconciliation confidence, and operational readiness across programme stakeholders.",

    "PDE-4980": "This SIT stream covers integration assurance for the Workday <> Datapay pathway, with KPMG and Datacom operating as joint delivery partners under TWoA governance. The objective is to confirm that payroll-relevant integrations process data accurately, consistently, and reliably across test environments before release progression.\n\nExecution begins with foundational connectivity proving: interface reachability, secure transport, encryption/decryption controls, and successful operational movement of integration files/messages between Workday and Datapay. Only after these controls are proven does scenario-level testing proceed.\n\nScenario execution validates inbound and outbound processing for agreed payroll integrations, including payload/schema conformance, field-level mapping accuracy, transformation logic, and source-to-target integrity. The stream also validates failure-path behaviour, including reject handling, retry/reprocess controls, and operational support workflows, to ensure defects are detectable, traceable, and recoverable.\n\nKPMG and Datacom jointly execute this stream, with KPMG leading Workday-side integration behaviour and Datacom leading Datapay-side processing behaviour. TWoA provides overarching SIT governance, evidence assurance, traceability, and triage governance to ensure outcomes are decision-ready for subsequent E2E and UAT phases.",
    "PDE-4982": "",
    "PDE-4990": "Data Migration Testing is the final pre-End-to-End assurance phase used to prove that in-scope data can be extracted, transformed, loaded, and reconciled into Workday HCM, Workday Financials, and DataPay with repeatable outcomes.\n\nThis phase validates migration readiness before entry into PDE-4604 by executing controlled migration waves, applying reconciliation controls, and confirming business acceptance of migrated outcomes. The focus is to identify and close migration defects early so E2E execution is not consumed by upstream data-quality and load defects.\n\nThe phase provides objective evidence that migration execution, reconciliation, and governance controls are stable enough to support integrated scenario testing in the E2E cycle.",
    "PDE-4991": "Data Migration Testing for User Acceptance is the assurance activity that confirms migrated data is complete, accurate, and operationally usable before and during business-led UAT execution.\n\nThis phase ensures that production-like migrated data in the UAT environment supports real user scenarios, role-based execution, and business validation outcomes. It focuses on reconciliation confidence, exception resolution, and data stability so UAT effort is spent validating business processes rather than correcting upstream migration defects.\n\nSuccessful completion gives TWoA a clear data-readiness position for UAT continuation and go-forward decision-making.",
    "PDE-5033": "The Integration phase validates that all in-scope interfaces are technically connected, secure, and able to exchange data reliably before broader scenario-based System Integration Testing begins. The primary objective is to prove interface readiness end-to-end at the transport and payload level, including connectivity, authentication, encryption/decryption, file movement, API/service invocation, scheduling, acknowledgements, and error handling.\n\nThis phase is intentionally focused on interface operability rather than full business-process coverage. It establishes confidence that integration pathways are stable, observable, and supportable in the target environment, so that downstream SIT and E2E execution can proceed with reduced technical risk. Defects and issues are managed in Xray on KPMG Jira, aligned to KPMG\u2019s defect lifecycle, severity/priority model, triage cadence, and evidence-based closure approach.",

    function lightenHex(hex, amount = 0.28) {
      const clean = String(hex || "").replace("#", "");
      if (!/^[0-9a-fA-F]{6}$/.test(clean)) {
        return hex;
      }
      const n = parseInt(clean, 16);
      const r = (n >> 16) & 255;
      const g = (n >> 8) & 255;
      const b = n & 255;
      const lr = Math.round(r + (255 - r) * amount);
      const lg = Math.round(g + (255 - g) * amount);
      const lb = Math.round(b + (255 - b) * amount);
      return `#${((1 << 24) + (lr << 16) + (lg << 8) + lb).toString(16).slice(1)}`;

        .replace(/</g, "&lt;")

        .replace(/\"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function getHoverCard() {
      return document.getElementById("hoverCard");
    }

    function buildTooltipHtml(task, stripText) {
      const category = CATEGORY_LABELS[task.category] || task.category;
      const jiraDescription = ISSUE_DESCRIPTIONS[task.key] || "";
      const description = jiraDescription && String(jiraDescription).trim()
        ? jiraDescription
        : DESCRIPTION_FALLBACK;
      const meta = {
        ...(ISSUE_METADATA[task.key] || {}),
        ...(ISSUE_METRICS[task.key] || {}),
      };
      const fieldsHtml = ISSUE_CONTEXT_FIELDS
        .map((label) => {
          const value = (meta[label] || "").trim();
          if (!value) {
            return "";
          }
          return `<div class="field-row"><div class="field-label">${escapeHtml(label)}</div><div class="field-value">${escapeHtml(value)}</div></div>`;
        })
        .filter(Boolean)
        .join("");
      const contextSection = fieldsHtml ? `<div class="field-grid">${fieldsHtml}</div>` : "";
      return `
        <div class="title">${escapeHtml(task.key)} | ${escapeHtml(task.title)}</div>
        <div class="meta">${escapeHtml(task.start)} to ${escapeHtml(task.end)} | ${escapeHtml(category)}${stripText ? ` | ${escapeHtml(stripText)}` : ""}</div>
        ${contextSection}
        <div><span class="desc-label">Description:</span><span class="desc-body">${escapeHtml(description)}</span></div>
      `;
    }

    function showTooltip(event, html) {
      const tooltip = getHoverCard();
      if (!tooltip) {
        return;
      }
      tooltip.innerHTML = html;
      tooltip.style.display = "block";
      moveTooltip(event);
    }

    function moveTooltip(event) {
      const tooltip = getHoverCard();
      if (!tooltip || tooltip.style.display === "none") {
        return;
      }
      const pad = 14;
      let x = event.clientX + pad;
      let y = event.clientY + pad;
      const maxX = window.innerWidth - tooltip.offsetWidth - 8;
      const maxY = window.innerHeight - tooltip.offsetHeight - 8;
      if (x > maxX) {
        x = event.clientX - tooltip.offsetWidth - pad;
      }
      if (y > maxY) {
        y = event.clientY - tooltip.offsetHeight - pad;
      }
      tooltip.style.left = `${Math.max(8, x)}px`;
      tooltip.style.top = `${Math.max(8, y)}px`;
    }

    function hideTooltip() {
      const tooltip = getHoverCard();
      if (!tooltip) {
        return;
      }
      tooltip.style.display = "none";
    }

    function isMilestoneTask(task) {
      const issueType = String(task.issueType || "").toLowerCase();
      // Milestone mode shows Jira Milestone types at any hierarchy level only.
      return issueType.includes("milestone");
    }

    function isGateTask(task) {
      const issueType = String(task.issueType || "").toLowerCase();
      // Gate mode shows Jira Gate types at any hierarchy level only.
      return issueType.includes("gate");
    }

    function isTestCycleTask(task) {
      const issueType = String(task.issueType || "").toLowerCase();
      // Test cycle mode shows Test Cycle and Test Cycle Level 0 types.
      return issueType.includes("test cycle");
    }

    function getIssueTypeIconSpec(issueType) {
      const type = String(issueType || "").toLowerCase();
      if (type.includes("milestone")) {
        return { shape: "diamond", fill: "#6f77b3", stroke: "#4f5684" };
      }
      if (type.includes("gate")) {
        return { shape: "triangle", fill: "#de350b", stroke: "#a52506" };
      }
      if (type.includes("test cycle level 0")) {
        return { shape: "ring", fill: "#2b86c5", stroke: "#1a5f90" };
      }
      if (type.includes("test cycle")) {
        return { shape: "circle", fill: "#2b86c5", stroke: "#1a5f90" };
      }
      if (type.includes("pre requisite")) {
        return { shape: "square", fill: "#7a869a", stroke: "#5e6c84" };
      }
      if (type.includes("story")) {
        return { shape: "rounded", fill: "#ffffff", stroke: "#5e6c84" };
      }
      return { shape: "circle", fill: "#8993a4", stroke: "#5e6c84" };
    }

    function getIssueTypeIconUrl(issueType) {
      const key = String(issueType || "").toLowerCase();
      for (const [name, url] of Object.entries(ISSUE_TYPE_ICONS)) {
        if (String(name).toLowerCase() === key && String(url || "").trim()) {
          return String(url).trim();
        }
      }
      return "";
    }

    function appendIssueTypeIcon(svg, svgns, issueType, xCenter, yCenter, size, tooltipHtml, addInteractivity) {
      const iconUrl = getIssueTypeIconUrl(issueType);
      if (iconUrl) {
        const img = document.createElementNS(svgns, "image");
        img.setAttribute("x", `${xCenter - size / 2}`);
        img.setAttribute("y", `${yCenter - size / 2}`);
        img.setAttribute("width", `${size}`);
        img.setAttribute("height", `${size}`);
        img.setAttribute("preserveAspectRatio", "xMidYMid meet");
        img.setAttribute("href", iconUrl);
        addInteractivity(img, tooltipHtml);
        svg.appendChild(img);
        return;
      }

      const icon = getIssueTypeIconSpec(issueType);
      const half = size / 2;
      let node;

      if (icon.shape === "diamond") {
        node = document.createElementNS(svgns, "polygon");
        node.setAttribute(
          "points",
          `${xCenter},${yCenter - half} ${xCenter + half},${yCenter} ${xCenter},${yCenter + half} ${xCenter - half},${yCenter}`
        );
      } else if (icon.shape === "triangle") {
        node = document.createElementNS(svgns, "polygon");
        node.setAttribute(
          "points",
          `${xCenter},${yCenter - half} ${xCenter + half},${yCenter + half} ${xCenter - half},${yCenter + half}`
        );
      } else if (icon.shape === "square" || icon.shape === "rounded") {
        node = document.createElementNS(svgns, "rect");
        node.setAttribute("x", `${xCenter - half}`);
        node.setAttribute("y", `${yCenter - half}`);
        node.setAttribute("width", `${size}`);
        node.setAttribute("height", `${size}`);
        if (icon.shape === "rounded") {
          node.setAttribute("rx", "2");
          node.setAttribute("ry", "2");
        }
      } else {
        node = document.createElementNS(svgns, "circle");
        node.setAttribute("cx", `${xCenter}`);
        node.setAttribute("cy", `${yCenter}`);
        node.setAttribute("r", `${half}`);
      }

      node.setAttribute("fill", icon.fill);
      node.setAttribute("stroke", icon.stroke);
      node.setAttribute("stroke-width", "1.4");
      addInteractivity(node, tooltipHtml);
      svg.appendChild(node);

      if (icon.shape === "ring") {
        const core = document.createElementNS(svgns, "circle");
        core.setAttribute("cx", `${xCenter}`);
        core.setAttribute("cy", `${yCenter}`);
        core.setAttribute("r", `${Math.max(1.5, half * 0.45)}`);
        core.setAttribute("fill", "#ffffff");
        core.setAttribute("stroke", "none");
        addInteractivity(core, tooltipHtml);
        svg.appendChild(core);
      }
    }

    function getBarTestTypeLabel(task) {
      const issueType = String(task.issueType || "").toLowerCase();
      const testType = String(task.testType || "").trim();
      const tt = testType.toLowerCase();
      if (issueType.includes("story")) {
        // Show full in-bar label for long NIP story bars (for example PDE-4687).
        if (task.category === "non integrated parallel") {
          return "Non Integrated Parallel";
        }
        return "";
      }
      if (testType) {
        if (tt.includes("system integration")) {
          return "SIT";
        }
        if (tt === "integration" && task.category === "system integration testing") {
          return "SIT";
        }
        return testType;
      }
      if (issueType.includes("gate")) {
        return "Gate";
      }
      if (issueType.includes("milestone")) {
        return "Milestone";
      }
      return CATEGORY_BAR_LABELS[task.category] || "Test";
    }

    function getCompactBarLabel(task) {
      const testType = String(task.testType || "").trim();
      const tt = testType.toLowerCase();
      if (!testType) {
        return CATEGORY_BAR_LABELS[task.category] || "Test";
      }
      if (tt.includes("data migration")) {
        return "Data Migration";
      }
      if (tt.includes("dress rehearsal")) {
        return "Dress Rehearsal";
      }
      if (tt.includes("production verification")) {
        return "PVT";
      }
      if (tt.includes("system integration")) {
        return "SIT";
      }
      if (tt.includes("end to end")) {
        return "E2E";
      }
      if (tt.includes("user acceptance")) {
        return "UAT";
      }
      if (tt.includes("non integrated parallel")) {
        return "NIP";
      }
      if (tt.includes("parallel run")) {
        return "Parallel";
      }
      if (tt.includes("parallel")) {
        return task.category === "non integrated parallel" ? "NIP" : "Parallel";
      }
      if (testType.includes(",")) {
        return testType.split(",")[0].trim();
      }
      return testType;
    }

    function getTinyBarLabel(task) {
      const compact = getCompactBarLabel(task);
      if (!compact) {
        return "";
      }
      const lc = compact.toLowerCase();
      if (lc === "data migration") return "DM";
      if (lc === "dress rehearsal") return "DR";
      if (lc === "parallel") return "PRL";
      if (lc === "connectivity") return "CONN";
      if (lc === "integration") return "INT";
      if (lc === "performance") return "PERF";
      if (lc === "security") return "SEC";
      return CATEGORY_TINY_LABELS[task.category] || compact;
    }

    function getBarLabelRenderSpec(task, widthPx) {
      const full = getBarTestTypeLabel(task);
      if (!full) {
        return null;
      }
      if (widthPx >= 120) {
        return { text: full, mode: "full" };
      }
      if (widthPx >= 90) {
        return { text: getCompactBarLabel(task), mode: "compact" };
      }
      // For short bars, prefer external pill labels for legibility.
      return null;
    }

    function taskPassesScope(task) {
      if (!showMilestonesOnly && !showGatesOnly && !showTestCyclesOnly) {
        return true;
      }
      let include = false;
      if (showMilestonesOnly) {
        include = include || isMilestoneTask(task);
      }
      if (showGatesOnly) {
        include = include || isGateTask(task);
      }
      if (showTestCyclesOnly) {
        include = include || isTestCycleTask(task);
      }
      return include;
    }

    function renderStamp() {
      const el = document.getElementById("renderStamp");
      if (!el) {
        return;
      }
      el.textContent = RENDERED_AT;
    }

    function getVisibleTaskKeysByFilter() {
      const scopedTasks = TASKS.filter(taskPassesScope);
      const scopedKeys = new Set(scopedTasks.map((t) => t.key));
      const visibleKeys = new Set(
        scopedTasks.filter((t) => selectedCategories.has(t.category)).map((t) => t.key)
      );
      const preservePredecessorContext = PRESERVE_PREDECESSOR_CONTEXT;
      const preserveParentContext = PRESERVE_PARENT_CONTEXT;

      if (preservePredecessorContext) {
        // Keep blocked-link context visible even when linked task categories differ.
        let changed = true;
        while (changed) {
          changed = false;
          DEPENDENCIES.forEach((d) => {
            if (visibleKeys.has(d.to) && !visibleKeys.has(d.from) && scopedKeys.has(d.from)) {
              visibleKeys.add(d.from);
              changed = true;
            }
          });
        }
      }

      if (preserveParentContext) {
        // Keep parent rows visible when any child row is in scope, even across categories.
        let changed = true;
        while (changed) {
          changed = false;
          TASKS.forEach((t) => {
            if (
              visibleKeys.has(t.key)
              && t.parent
              && !visibleKeys.has(t.parent)
              && scopedKeys.has(t.parent)
            ) {
              visibleKeys.add(t.parent);
              changed = true;
            }
          });
        }
      }

      return visibleKeys;
    }

    function getVisibleTasks() {
      const visibleKeys = getVisibleTaskKeysByFilter();
      const taskByKey = TASKS.reduce((acc, t) => {
        acc[t.key] = t;
        return acc;
      }, {});
      const childrenByParent = TASKS.reduce((acc, t) => {
        if (t.parent) {
          if (!acc[t.parent]) {
            acc[t.parent] = [];
          }
          acc[t.parent].push(t);
        }
        return acc;
      }, {});

      const ordered = [];
      const pushed = new Set();

      const pushTaskTree = (task) => {
        if (!task || pushed.has(task.key) || !visibleKeys.has(task.key)) {
          return;
        }
        pushed.add(task.key);
        ordered.push(task);
        if (collapsedParents.has(task.key)) {
          return;
        }
        (childrenByParent[task.key] || []).forEach((child) => {
          pushTaskTree(child);
        });
      };

      // Render roots first, then any remaining visible orphans.
      // If a parent is filtered out, show visible children as temporary roots.
      TASKS.forEach((t) => {
        if (!t.parent || !taskByKey[t.parent] || !visibleKeys.has(t.parent)) {
          pushTaskTree(t);
        }
      });
      TASKS.forEach((t) => {
        if (t.parent && taskByKey[t.parent] && visibleKeys.has(t.parent)) {
          return;
        }
        pushTaskTree(t);
      });

      return ordered;
    }

    function renderLegendFilters() {
      const mount = document.getElementById("legendFilters");
      if (!mount) {
        return;
      }
      mount.innerHTML = "";

      const categoryStartByType = new Map();
      TASKS.forEach((task) => {
        if (!task.category || !task.start) {
          return;
        }
        const issueType = String(task.issueType || "").toLowerCase();
        if (!issueType.includes("test cycle")) {
          return;
        }
        const current = categoryStartByType.get(task.category);
        if (!current || task.start < current) {
          categoryStartByType.set(task.category, task.start);
        }
      });
      const categoriesInData = new Set(
        TASKS.map((task) => String(task.category || "").trim()).filter(Boolean)
      );
      const orderedCategories = [...CATEGORY_ORDER].filter((cat) => categoriesInData.has(cat)).sort((a, b) => {
        const aStart = categoryStartByType.get(a) || "9999-12-31";
        const bStart = categoryStartByType.get(b) || "9999-12-31";
        if (aStart !== bStart) {
          return aStart.localeCompare(bStart);
        }
        return CATEGORY_ORDER.indexOf(a) - CATEGORY_ORDER.indexOf(b);
      });

      orderedCategories.forEach((cat) => {
        const style = CATEGORY_STYLES[cat] || { fill: "#dfe1e6", stroke: "#b3bac5" };
        const active = selectedCategories.has(cat);
        const fullLabel = CATEGORY_LABELS[cat] || cat;
        const compactLabel = CATEGORY_FILTER_LABELS[cat] || fullLabel;
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = `legend-filter${active ? "" : " inactive"}`;
        btn.title = `${active ? "Hide" : "Show"} ${fullLabel}`;
        btn.innerHTML = `<span class="swatch" style="background:${style.fill};border-color:${style.stroke};"></span><span class="label">${compactLabel}</span>`;
        btn.addEventListener("click", () => {
          const allSelected = orderedCategories.every((name) => selectedCategories.has(name));
          if (allSelected && selectedCategories.has(cat)) {
            selectedCategories.clear();
            selectedCategories.add(cat);
            renderAll();
            return;
          }
          if (selectedCategories.has(cat)) {
            selectedCategories.delete(cat);
          } else {
            selectedCategories.add(cat);
          }
          renderAll();
        });
        mount.appendChild(btn);
      });

      const resetBtn = document.createElement("button");
      resetBtn.type = "button";
      resetBtn.className = "legend-filter reset";
      resetBtn.textContent = "Reset Filters";
      resetBtn.title = "Show all test types";
      const allAvailableSelected = orderedCategories.every((name) => selectedCategories.has(name));
      resetBtn.disabled = allAvailableSelected && !showMilestonesOnly && !showGatesOnly && !showTestCyclesOnly;
      resetBtn.addEventListener("click", () => {
        selectedCategories.clear();
        orderedCategories.forEach((cat) => selectedCategories.add(cat));
        showMilestonesOnly = false;
        showGatesOnly = false;
        showTestCyclesOnly = false;
        renderAll();
      });
      mount.appendChild(resetBtn);
    }

    function renderParentControls() {
      const mount = document.getElementById("parentControls");
      if (!mount) {
        return;
      }
      mount.innerHTML = "";
      const hasChildGroups = parentsWithChildren.length > 0;

      const collapseAll = document.createElement("button");
      collapseAll.type = "button";
      collapseAll.className = "parent-toggle global";
      collapseAll.textContent = hasChildGroups ? "Collapse All" : "Collapse All (no child groups)";
      collapseAll.title = hasChildGroups ? "Collapse children for all parents" : "No parent-child groups are available in this view";
      collapseAll.disabled = !hasChildGroups;
      collapseAll.addEventListener("click", () => {
        if (!hasChildGroups) {
          return;
        }
        parentsWithChildren.forEach((p) => collapsedParents.add(p.key));
        renderAll();
      });
      mount.appendChild(collapseAll);

      const expandAll = document.createElement("button");
      expandAll.type = "button";
      expandAll.className = "parent-toggle global";
      expandAll.textContent = hasChildGroups ? "Expand All" : "Expand All (no child groups)";
      expandAll.title = hasChildGroups ? "Expand children for all parents" : "No parent-child groups are available in this view";
      expandAll.disabled = !hasChildGroups;
      expandAll.addEventListener("click", () => {
        if (!hasChildGroups) {
          return;
        }
        collapsedParents.clear();
        renderAll();
      });
      mount.appendChild(expandAll);

      const categoryStartByType = new Map();
      TASKS.forEach((task) => {
        if (!task.category || !task.start) {
          return;
        }
        const issueType = String(task.issueType || "").toLowerCase();
        if (!issueType.includes("test cycle")) {
          return;
        }
        const current = categoryStartByType.get(task.category);
        if (!current || task.start < current) {
          categoryStartByType.set(task.category, task.start);
        }
      });
      const categoriesInData = new Set(
        TASKS.map((task) => String(task.category || "").trim()).filter(Boolean)
      );
      const orderedCategories = [...CATEGORY_ORDER].filter((cat) => categoriesInData.has(cat)).sort((a, b) => {
        const aStart = categoryStartByType.get(a) || "9999-12-31";
        const bStart = categoryStartByType.get(b) || "9999-12-31";
        if (aStart !== bStart) {
          return aStart.localeCompare(bStart);
        }
        return CATEGORY_ORDER.indexOf(a) - CATEGORY_ORDER.indexOf(b);
      });
      const categoryRank = new Map(orderedCategories.map((cat, idx) => [cat, idx]));
      const orderedParents = [...parentsWithChildren].sort((a, b) => {
        const aRank = categoryRank.has(a.category) ? categoryRank.get(a.category) : Number.MAX_SAFE_INTEGER;
        const bRank = categoryRank.has(b.category) ? categoryRank.get(b.category) : Number.MAX_SAFE_INTEGER;
        if (aRank !== bRank) {
          return aRank - bRank;
        }
        if (a.start !== b.start) {
          return String(a.start || "").localeCompare(String(b.start || ""));
        }
        return String(a.key || "").localeCompare(String(b.key || ""));
      });

      orderedParents.forEach((p) => {
        const isCollapsed = collapsedParents.has(p.key);
        const groupLabel = getCompactBarLabel(p) || CATEGORY_FILTER_LABELS[p.category] || p.key;
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = `parent-toggle${isCollapsed ? " collapsed" : ""}`;
        btn.textContent = `${isCollapsed ? "▸" : "▾"} ${groupLabel} (${childCountByParent[p.key]})`;
        btn.title = `${isCollapsed ? "Expand" : "Collapse"} children for ${groupLabel} (${p.key})`;
        btn.addEventListener("click", () => {
          if (collapsedParents.has(p.key)) {
            collapsedParents.delete(p.key);
          } else {
            collapsedParents.add(p.key);
          }
          renderAll();
        });
        mount.appendChild(btn);
      });
    }

    function renderCustomGantt() {
      const mount = document.getElementById("ganttMount");
      if (!mount) {
        return;
      }
      mount.innerHTML = "";

      const tasks = getVisibleTasks();
      if (!tasks.length) {
        return;
      }
      const timelineTasks = (showMilestonesOnly || showGatesOnly || showTestCyclesOnly) ? TASKS : tasks;
      const minDate = new Date(Math.min(...timelineTasks.map((t) => toDate(t.start).getTime())));
      const maxDate = new Date(Math.max(...timelineTasks.map((t) => toDate(t.end).getTime())));
      const dayMs = 24 * 60 * 60 * 1000;
      const totalDays = Math.max(1, Math.round((maxDate - minDate) / dayMs) + 1);

      const rowH = 28;
      const rowGap = 8;
      const plotW = 1180;
      const left = 40;
      const top = 24;
      const bottom = 56;
      const width = left + plotW + 180;
      const height = top + tasks.length * (rowH + rowGap) + bottom;

      const svgns = "http://www.w3.org/2000/svg";
      const svg = document.createElementNS(svgns, "svg");
      svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
      svg.setAttribute("class", "gantt-svg");

      const defs = document.createElementNS(svgns, "defs");
      const markerPre = document.createElementNS(svgns, "marker");
      markerPre.setAttribute("id", "arrow-pre");
      markerPre.setAttribute("viewBox", "0 0 10 10");
      markerPre.setAttribute("refX", "9");
      markerPre.setAttribute("refY", "5");
      markerPre.setAttribute("markerWidth", "6");
      markerPre.setAttribute("markerHeight", "6");
      markerPre.setAttribute("orient", "auto-start-reverse");
      const markerPrePath = document.createElementNS(svgns, "path");
      markerPrePath.setAttribute("d", "M 0 0 L 10 5 L 0 10 z");
      markerPrePath.setAttribute("fill", "#5e6c84");
      markerPre.appendChild(markerPrePath);
      defs.appendChild(markerPre);

      svg.appendChild(defs);

      const addGridlineRollover = (node, heading, value) => {
        const tooltipHtml = `<div class="title">${escapeHtml(heading)}</div><div class="meta">${escapeHtml(value)}</div>`;
        const tt = document.createElementNS(svgns, "title");
        tt.textContent = `${heading}: ${value}`;
        node.appendChild(tt);
        node.setAttribute("pointer-events", "all");
        node.addEventListener("mouseenter", (event) => {
          showTooltip(event, tooltipHtml);
        });
        node.addEventListener("mousemove", (event) => {
          moveTooltip(event);
        });
        node.addEventListener("mouseleave", () => {
          hideTooltip();
        });
      };

      // Grid month lines
      const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      let d = new Date(minDate.getFullYear(), minDate.getMonth(), 1);
      if (d < minDate) {
        d = new Date(minDate.getFullYear(), minDate.getMonth() + 1, 1);
      }
      while (d <= maxDate) {
        const offsetDays = Math.round((d - minDate) / dayMs);
        const x = left + (offsetDays / totalDays) * plotW;

        const line = document.createElementNS(svgns, "line");
        line.setAttribute("x1", `${x}`);
        line.setAttribute("x2", `${x}`);
        line.setAttribute("y1", `${top}`);
        line.setAttribute("y2", `${height - bottom}`);
        line.setAttribute("stroke", "#c3ccda");
        line.setAttribute("stroke-width", "1");
        const monthLabel = `01 ${monthNames[d.getMonth()]} ${d.getFullYear()}`;
        addGridlineRollover(line, "Month boundary", monthLabel);
        svg.appendChild(line);

        const txt = document.createElementNS(svgns, "text");
        txt.setAttribute("x", `${x + 4}`);
        txt.setAttribute("y", `${height - 8}`);
        txt.setAttribute("font-size", "11");
        txt.setAttribute("fill", "#6b778c");
        txt.textContent = monthLabel;
        addGridlineRollover(txt, "Month boundary", monthLabel);
        svg.appendChild(txt);

        // Add an explicit hover target near the month label so rollover is easy to trigger.
        const monthHit = document.createElementNS(svgns, "rect");
        monthHit.setAttribute("x", `${x - 10}`);
        monthHit.setAttribute("y", `${height - 34}`);
        monthHit.setAttribute("width", "64");
        monthHit.setAttribute("height", "26");
        monthHit.setAttribute("fill", "transparent");
        addGridlineRollover(monthHit, "Month boundary", monthLabel);
        svg.appendChild(monthHit);

        d = new Date(d.getFullYear(), d.getMonth() + 1, 1);
      }

      // Start-of-week grid lines and labels (Monday).
      const weekStart = new Date(minDate);
      while (weekStart.getDay() !== 1) {
        weekStart.setDate(weekStart.getDate() + 1);
      }
      for (let w = new Date(weekStart); w <= maxDate; w.setDate(w.getDate() + 7)) {
        const offsetDays = Math.round((w - minDate) / dayMs);
        const x = left + (offsetDays / totalDays) * plotW;

        const weekLine = document.createElementNS(svgns, "line");
        weekLine.setAttribute("x1", `${x}`);
        weekLine.setAttribute("x2", `${x}`);
        weekLine.setAttribute("y1", `${top}`);
        weekLine.setAttribute("y2", `${height - bottom}`);
        weekLine.setAttribute("stroke", "#d0d9e7");
        weekLine.setAttribute("stroke-width", "1");
        weekLine.setAttribute("stroke-dasharray", "3 4");
        const weekLabel = `${String(w.getDate()).padStart(2, "0")}${String(w.getMonth() + 1).padStart(2, "0")}`;
        const weekVerbose = `${String(w.getDate()).padStart(2, "0")} ${monthNames[w.getMonth()]} ${w.getFullYear()}`;
        addGridlineRollover(weekLine, "Week commencing", weekVerbose);
        svg.appendChild(weekLine);

        const weekTxt = document.createElementNS(svgns, "text");
        weekTxt.setAttribute("x", `${x + 1}`);
        weekTxt.setAttribute("y", `${height - 26}`);
        weekTxt.setAttribute("font-size", "9");
        weekTxt.setAttribute("fill", "#97a0af");
        weekTxt.textContent = weekLabel;
        addGridlineRollover(weekTxt, "Week commencing", weekVerbose);
        svg.appendChild(weekTxt);

        // Add an explicit hover target near the week label for reliable date rollovers.
        const weekHit = document.createElementNS(svgns, "rect");
        weekHit.setAttribute("x", `${x - 6}`);
        weekHit.setAttribute("y", `${height - 36}`);
        weekHit.setAttribute("width", "34");
        weekHit.setAttribute("height", "16");
        weekHit.setAttribute("fill", "transparent");
        addGridlineRollover(weekHit, "Week commencing", weekVerbose);
        svg.appendChild(weekHit);
      }

      const barPosByKey = {};
      const visibleTaskKeySet = new Set(tasks.map((task) => task.key));
      const externalLabelLayers = [];

      tasks.forEach((t, idx) => {
        const st = toDate(t.start);
        const en = toDate(t.end);
        const startDays = Math.max(0, Math.round((st - minDate) / dayMs));
        const durDays = Math.max(1, Math.round((en - st) / dayMs) + 1);
        const x = left + (startDays / totalDays) * plotW;
        const w = Math.max(8, (durDays / totalDays) * plotW);
        const y = top + idx * (rowH + rowGap);
        const isChild = Boolean(t.parent && visibleTaskKeySet.has(t.parent));
        const barH = isChild ? Math.max(10, Math.round(rowH * 0.44)) : rowH;
        const yBar = y + (rowH - barH) / 2;

        const style = CATEGORY_STYLES[t.category] || { fill: "#dfe1e6", stroke: "#b3bac5" };
        const barStyle = isChild
          ? { fill: lightenHex(style.fill, 0.68), stroke: lightenHex(style.stroke, 0.52) }
          : style;
        const dual = DUAL_STRIP_BY_KEY[t.key];
        const tooltipHtml = buildTooltipHtml(t, dual ? `Strip: ${dual[0]} + ${dual[1]}` : "");

        const addInteractivity = (node, tooltipHtml) => {
          node.style.cursor = "pointer";
          node.addEventListener("mouseenter", (event) => {
            showTooltip(event, tooltipHtml);
          });
          node.addEventListener("mousemove", (event) => {
            moveTooltip(event);
          });
          node.addEventListener("mouseleave", () => {
            hideTooltip();
          });
          node.addEventListener("click", () => {
            window.open(`https://twoa.atlassian.net/browse/${t.key}`, "_blank", "noopener,noreferrer");
          });
        };

        if (dual) {
          const topBase = CATEGORY_STYLES[dual[0]] || barStyle;
          const bottomBase = CATEGORY_STYLES[dual[1]] || barStyle;
          const topStyle = isChild
            ? { fill: lightenHex(topBase.fill, 0.68), stroke: lightenHex(topBase.stroke, 0.52) }
            : topBase;
          const bottomStyle = isChild
            ? { fill: lightenHex(bottomBase.fill, 0.68), stroke: lightenHex(bottomBase.stroke, 0.52) }
            : bottomBase;
          const half = barH / 2;

          const topRect = document.createElementNS(svgns, "rect");
          topRect.setAttribute("x", `${x}`);
          topRect.setAttribute("y", `${yBar}`);
          topRect.setAttribute("width", `${w}`);
          topRect.setAttribute("height", `${half}`);
          topRect.setAttribute("fill", topStyle.fill);
          topRect.setAttribute("stroke", "none");
          addInteractivity(topRect, tooltipHtml);
          svg.appendChild(topRect);

          const bottomRect = document.createElementNS(svgns, "rect");
          bottomRect.setAttribute("x", `${x}`);
          bottomRect.setAttribute("y", `${yBar + half}`);
          bottomRect.setAttribute("width", `${w}`);
          bottomRect.setAttribute("height", `${half}`);
          bottomRect.setAttribute("fill", bottomStyle.fill);
          bottomRect.setAttribute("stroke", "none");
          addInteractivity(bottomRect, tooltipHtml);
          svg.appendChild(bottomRect);

          const outline = document.createElementNS(svgns, "rect");
          outline.setAttribute("x", `${x}`);
          outline.setAttribute("y", `${yBar}`);
          outline.setAttribute("rx", "4");
          outline.setAttribute("ry", "4");
          outline.setAttribute("width", `${w}`);
          outline.setAttribute("height", `${barH}`);
          outline.setAttribute("fill", "none");
          outline.setAttribute("stroke", barStyle.stroke);
          outline.setAttribute("stroke-width", isChild ? "0.9" : "1.5");
          addInteractivity(outline, tooltipHtml);
          svg.appendChild(outline);
          barPosByKey[t.key] = { x, y: yBar, w, h: barH };
        } else {
          const rect = document.createElementNS(svgns, "rect");
          rect.setAttribute("x", `${x}`);
          rect.setAttribute("y", `${yBar}`);
          rect.setAttribute("rx", "4");
          rect.setAttribute("ry", "4");
          rect.setAttribute("width", `${w}`);
          rect.setAttribute("height", `${barH}`);
          rect.setAttribute("fill", barStyle.fill);
          rect.setAttribute("stroke", barStyle.stroke);
          rect.setAttribute("stroke-width", isChild ? "0.9" : "1.5");
          addInteractivity(rect, tooltipHtml);
          svg.appendChild(rect);
          barPosByKey[t.key] = { x, y: yBar, w, h: barH };
        }

        const iconSize = isChild ? 8 : 10;
        const iconX = Math.max(8, x - iconSize - 3);
        const iconY = yBar + barH / 2;
        appendIssueTypeIcon(svg, svgns, t.issueType, iconX, iconY, iconSize, tooltipHtml, addInteractivity);

        // Tiered label strategy keeps short bars readable: full/compact/tiny in-bar,
        // and for very short bars render the same compact label outside the bar.
        const barLabelSpec = getBarLabelRenderSpec(t, w);
        if (barLabelSpec && barLabelSpec.text) {
          const label = document.createElementNS(svgns, "text");
          label.setAttribute("x", `${x + 6}`);
          label.setAttribute("y", `${yBar + barH / 2 + 0.5}`);
          label.setAttribute("font-size", isChild ? "9" : "10");
          label.setAttribute("font-weight", "600");
          label.setAttribute("dominant-baseline", "middle");
          label.setAttribute("fill", "#101820");
          label.setAttribute("stroke", "#ffffff");
          label.setAttribute("stroke-width", "2.2");
          label.setAttribute("paint-order", "stroke");
          label.setAttribute("stroke-linejoin", "round");
          label.textContent = barLabelSpec.text;
          addInteractivity(label, tooltipHtml);
          svg.appendChild(label);
        } else {
          const shortLabel = getCompactBarLabel(t);
          if (shortLabel) {
            const label = document.createElementNS(svgns, "text");
            const rightX = x + w + 4;
            label.setAttribute("x", `${rightX}`);
            label.setAttribute("y", `${yBar + barH / 2 + 0.5}`);
            label.setAttribute("font-size", isChild ? "9.5" : "10");
            label.setAttribute("font-weight", "600");
            label.setAttribute("dominant-baseline", "middle");
            label.setAttribute("fill", "#ffffff");
            label.setAttribute("stroke", "#0b1220");
            label.setAttribute("stroke-width", "1");
            label.setAttribute("paint-order", "stroke");
            label.textContent = shortLabel;
            addInteractivity(label, tooltipHtml);
            svg.appendChild(label);

            // Add a high-contrast pill behind external labels for readability over gridlines.
            const bbox = label.getBBox();
            const bg = document.createElementNS(svgns, "rect");
            const padX = 3;
            const padY = 2;
            bg.setAttribute("x", `${bbox.x - padX}`);
            bg.setAttribute("y", `${bbox.y - padY}`);
            bg.setAttribute("width", `${bbox.width + padX * 2}`);
            bg.setAttribute("height", `${bbox.height + padY * 2}`);
            bg.setAttribute("rx", "3");
            bg.setAttribute("ry", "3");
            bg.setAttribute("fill", "#0f172a");
            bg.setAttribute("fill-opacity", "0.94");
            bg.setAttribute("stroke", "#ffffff");
            bg.setAttribute("stroke-width", "0.8");
            addInteractivity(bg, tooltipHtml);
            svg.insertBefore(bg, label);

            // Repaint these above dependency lines after they are drawn.
            externalLabelLayers.push(bg, label);
          }
        }
      });

      DEPENDENCIES.forEach((d) => {
        const from = barPosByKey[d.from];
        const to = barPosByKey[d.to];
        if (!from || !to) {
          return;
        }
        const sx = from.x + from.w;
        const sy = from.y + from.h / 2;
        const ex = to.x;
        const ey = to.y + to.h / 2;
        const dx = Math.max(30, Math.abs(ex - sx) * 0.4);

        const path = document.createElementNS(svgns, "path");
        path.setAttribute("d", `M ${sx} ${sy} C ${sx + dx} ${sy}, ${ex - dx} ${ey}, ${ex} ${ey}`);
        path.setAttribute("fill", "none");
        path.setAttribute("stroke", "#5e6c84");
        path.setAttribute("marker-end", "url(#arrow-pre)");
        path.setAttribute("stroke-width", "1.6");
        path.setAttribute("opacity", "0.9");
        const tt = document.createElementNS(svgns, "title");
        tt.textContent = `${d.from} -> ${d.to} (${d.kind})`;
        path.appendChild(tt);
        svg.appendChild(path);
      });

      // Keep external short-bar labels readable by layering them above connectors.
      externalLabelLayers.forEach((node) => {
        svg.appendChild(node);
      });

      // Today marker (draw last so it stays on top of bars/dependencies).
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      if (today >= minDate && today <= maxDate) {
        const offsetDays = Math.round((today - minDate) / dayMs);
        const x = left + (offsetDays / totalDays) * plotW;

        const todayLine = document.createElementNS(svgns, "line");
        todayLine.setAttribute("x1", `${x}`);
        todayLine.setAttribute("x2", `${x}`);
        todayLine.setAttribute("y1", `${top - 8}`);
        todayLine.setAttribute("y2", `${height - bottom}`);
        todayLine.setAttribute("stroke", "#de350b");
        todayLine.setAttribute("stroke-width", "2");
        todayLine.setAttribute("stroke-dasharray", "6 4");
        todayLine.setAttribute("opacity", "1");
        svg.appendChild(todayLine);

        const todayLabel = document.createElementNS(svgns, "text");
        todayLabel.setAttribute("x", `${x + 4}`);
        todayLabel.setAttribute("y", `${top - 6}`);
        todayLabel.setAttribute("font-size", "11");
        todayLabel.setAttribute("font-weight", "700");
        todayLabel.setAttribute("fill", "#de350b");
        todayLabel.textContent = "Today";
        svg.appendChild(todayLabel);
      }

      mount.appendChild(svg);
    }

    function renderAll() {
      renderStamp();
      renderViewControls();
      renderLegendFilters();
      renderParentControls();
      renderCustomGantt();
    }

    window.addEventListener("DOMContentLoaded", renderAll);
    window.addEventListener("scroll", hideTooltip, true);
  </script>
</head>
<body>
  <div class="wrap"><div class="card">
    <h1><a href="https://twoa.atlassian.net/jira/plans/959/scenarios/959/timeline?vid=1053" target="_blank" rel="noopener noreferrer">SEF Phase 1 | HCM and Payroll</a></h1>
    <p class="render-meta">Rendered: <span id="renderStamp"></span></p>
    <div id="viewControls" class="view-controls"></div>
    <div class="legend">
      <span id="legendFilters" class="legend-item"></span>
      <span class="legend-item"><span class="dep-swatch"></span>Precursor Dependency</span>
    </div>
    <div id="parentControls" class="parent-controls"></div>
    <div class="chart"><div id="ganttMount"></div></div>
    <div id="hoverCard" class="hover-card" aria-hidden="true"></div>
  </div></div>
</body>
</html>
